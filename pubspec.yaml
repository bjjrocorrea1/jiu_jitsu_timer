name: jiu_jitsu_timer
description: Timer simples para treinos e rolas de jiu-jitsu.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.wav

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/tako_bjj.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon/tako_bjj.png"
    
